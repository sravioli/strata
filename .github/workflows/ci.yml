name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decides which jobs run. A job runs only when files it checks change; actionlint covers edits to this file.
  changes:
    runs-on: ubuntu-latest
    outputs:
      config: ${{ steps.f.outputs.config }}
      prose: ${{ steps.f.outputs.prose }}
      rust: ${{ steps.f.outputs.rust }}
      deny: ${{ steps.f.outputs.deny }}
      sql: ${{ steps.f.outputs.sql }}
      proofs: ${{ steps.f.outputs.proofs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: f
        with:
          filters: |
            config:
              - '**/*.{md,yaml,yml,toml,sh}'
              - '.github/**'
            prose:
              - 'docs/tech-design/**'
              - 'docs/adr/**'
              - '.agents/skills/asd-ste100/scripts/**'
              - '.github/workflows/ci.yml'
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - 'rust-toolchain*'
            deny:
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - 'deny.toml'
            sql:
              - '**/*.sql'
            proofs:
              - 'crates/core/**'
              - 'lean/**'
              - 'scripts/translate.sh'
              - 'scripts/install-aeneas.sh'
              - 'scripts/check-proofs.py'
              - 'scripts/proof-obligations.py'
              - 'scripts/tests/**'
              - 'docs/tech-design/**'
              - 'toolchain.env'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The cocogitto action installs cog 6.5.0, which rejects `pre` in cog.toml. Install the version used locally.
      - run: |
          curl -fsSL https://github.com/cocogitto/cocogitto/releases/download/7.0.0/cocogitto-7.0.0-x86_64-unknown-linux-musl.tar.gz | tar xz
          find . -name cog -type f -exec install -m755 {} /usr/local/bin/cog \;
      - run: cog check ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: |
          curl -fsSL https://github.com/betterleaks/betterleaks/releases/download/v1.10.1/betterleaks_1.10.1_linux_x64.tar.gz | tar xz betterleaks
          ./betterleaks git .

  config:
    needs: changes
    if: needs.changes.outputs.config == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34  # v25.0.0
      - uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c  # v3.1.1
        with:
          file_or_dir: .
          config_file: .yamllint.yaml
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7  # v2.2.0
      - run: |
          python3 -m venv "$RUNNER_TEMP/taplo"
          "$RUNNER_TEMP/taplo/bin/python" -m pip install --require-hashes --no-deps -r .github/requirements/taplo.txt
          "$RUNNER_TEMP/taplo/bin/taplo" fmt --check
      - run: git ls-files 'scripts/*.sh' | xargs -r shellcheck

  prose:
    needs: changes
    if: needs.changes.outputs.prose == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Templates (0000-*) stay out: they hold placeholder text.
      - run: git ls-files 'docs/tech-design/*.md' 'docs/adr/*.md' | grep -v '/0000-' | xargs -r python3 .agents/skills/asd-ste100/scripts/ste-lint.py

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca  # stable branch, 2026-11
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --locked
          scripts/check-toolchain.sh

  deny:
    needs: changes
    if: needs.changes.outputs.deny == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Skips until the first crate lands: with no Cargo.toml, cargo-deny fails.
      - if: hashFiles('Cargo.toml') != ''
        uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9  # v2.1.2

  # The checks of tech design 0009 ("The definition of proved"). Any failure fails ci-ok.
  verify:
    needs: changes
    if: needs.changes.outputs.proofs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install Aeneas and Charon (pinned package, SHA-256 checked)
        run: |
          scripts/install-aeneas.sh "$RUNNER_TEMP/aeneas"
          echo "$RUNNER_TEMP/aeneas" >> "$GITHUB_PATH"
      # Charon needs its pinned nightly with the compiler libraries. The crates still build on stable.
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca  # stable branch, 2026-11
        with:
          toolchain: nightly-2026-09-17
          components: rustc-dev, llvm-tools, rust-src
      - name: Check 1, fresh translation
        run: scripts/translate.sh --check
      # Gets the Mathlib cache and the GitHub cache of lean/.lake, then runs lake build.
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee  # v1.7.1
        with:
          lake-package-directory: lean
      - name: Checks 2 to 5, theorems and axioms
        run: python3 scripts/check-proofs.py
      - name: Tests of the checks
        run: >-
          python3 -m unittest scripts/tests/test_check_proofs.py scripts/tests/test_translate.py
          scripts/tests/test_install_aeneas.py scripts/tests/test_proof_obligations.py scripts/tests/test_toolchain.py

  sql:
    needs: changes
    if: needs.changes.outputs.sql == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Real validation: every .sql file must apply, in path order, to an empty Postgres.
      - run: |
          files=$(git ls-files '*.sql' | sort)
          pipx install sqlfluff
          echo "$files" | xargs sqlfluff lint --dialect postgres
          for f in $files; do psql -v ON_ERROR_STOP=1 -q -f "$f"; done

  # Each test case ID has a test or a PENDING marker. Runs on each run: any file can add or remove an ID.
  test-cases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts/tests
      - run: python3 scripts/check-test-cases.py

  # L1: tests against the services of compose.yaml (docs/agents/testing.md). Runs on each pull request.
  l1:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca  # stable branch, 2026-11
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - run: docker compose up --wait
      - run: scripts/dev-services-smoke.sh
      - run: cargo test --workspace --locked --all-features
      - if: always()
        run: docker compose down -v

  # Make only this job a required check. A skipped job counts as passed.
  ci-ok:
    if: always()
    needs: [changes, commits, secrets, config, prose, rust, deny, verify, sql, test-cases, l1]
    runs-on: ubuntu-latest
    steps:
      - run: |
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = false ]
