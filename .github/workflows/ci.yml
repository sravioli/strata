name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decides which jobs run. A job runs only when files it checks change; actionlint covers edits to this file.
  changes:
    runs-on: ubuntu-latest
    outputs:
      config: ${{ steps.f.outputs.config }}
      prose: ${{ steps.f.outputs.prose }}
      rust: ${{ steps.f.outputs.rust }}
      deny: ${{ steps.f.outputs.deny }}
      sql: ${{ steps.f.outputs.sql }}
      proofs: ${{ steps.f.outputs.proofs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: f
        with:
          filters: |
            config:
              - '**/*.{md,yaml,yml,toml,sh}'
              - '.github/**'
              - 'Makefile'
            prose:
              - 'docs/tech-design/**'
              - 'docs/adr/**'
              - '.agents/skills/asd-ste100/scripts/**'
              - '.github/workflows/ci.yml'
              - 'Makefile'
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - 'rust-toolchain*'
              - 'CONSTRAINTS.md'
              - '.github/workflows/ci.yml'
              - 'Makefile'
              - '.github/requirements/tools.env'
              - 'scripts/install-tool.sh'
            deny:
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - 'deny.toml'
              - 'Makefile'
              - '.github/requirements/tools.env'
              - 'scripts/install-tool.sh'
            sql:
              - '**/*.sql'
              - '.github/requirements/**'
              - 'Makefile'
            proofs:
              - 'crates/core/**'
              - 'lean/**'
              - 'scripts/translate.sh'
              - 'scripts/install-aeneas.sh'
              - 'scripts/check-toolchain.sh'
              - 'scripts/check-proofs.py'
              - 'scripts/proof-obligations.py'
              - 'scripts/tests/**'
              - 'docs/tech-design/**'
              - 'toolchain.env'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
              - 'Makefile'

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # make installs the pinned cog (.github/requirements/tools.env). The cocogitto action has cog 6.5.0,
      # which rejects `pre` in cog.toml.
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: make commits RANGE="$BASE..$HEAD"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: make secrets

  config:
    needs: changes
    if: needs.changes.outputs.config == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # The tools are hash-pinned in .github/requirements (Scorecard Pinned-Dependencies).
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.8"
          enable-cache: false
      - run: make lint

  prose:
    needs: changes
    if: needs.changes.outputs.prose == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: make prose

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca  # stable branch, 2026-11
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - run: make rust

  deny:
    needs: changes
    if: needs.changes.outputs.deny == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: make deny

  # The checks of tech design 0009 ("The definition of proved"). Any failure fails ci-ok.
  verify:
    needs: changes
    if: needs.changes.outputs.proofs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # make verify installs the pinned Aeneas and Charon. This step reads the nightly that Charon needs.
      - name: Read the pins
        id: pins
        run: |
          . ./toolchain.env
          echo "charon-rust=$CHARON_RUST" >> "$GITHUB_OUTPUT"
      # Charon needs its pinned nightly with the compiler libraries. The crates still build on stable.
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca  # stable branch, 2026-11
        with:
          toolchain: ${{ steps.pins.outputs.charon-rust }}
          components: rustc-dev, llvm-tools, rust-src
      # Gets the Mathlib cache and the GitHub cache of lean/.lake, then runs lake build.
      # Measured on PR #37: 320 s with no GitHub cache (Mathlib from its cache, 214 Aeneas modules built),
      # 76 s with the GitHub cache (nothing built).
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee  # v1.7.1
        with:
          lake-package-directory: lean
      # Check 1 (fresh translation), checks 2 to 5 (theorems and axioms), and the tests of the checks.
      - run: make verify

  sql:
    needs: changes
    if: needs.changes.outputs.sql == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:19
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.8"
          enable-cache: false
      - run: make sql

  # Each test case ID has a test or a PENDING marker. Runs on each run: any file can add or remove an ID.
  test-cases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: make test-cases

  # L1: tests against the services of compose.yaml (docs/agents/testing.md). Runs on each pull request.
  l1:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca  # stable branch, 2026-11
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - run: make l1

  # Make only this job a required check. A skipped job counts as passed.
  ci-ok:
    if: always()
    needs: [changes, commits, secrets, config, prose, rust, deny, verify, sql, test-cases, l1]
    runs-on: ubuntu-latest
    steps:
      - run: |
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = false ]
