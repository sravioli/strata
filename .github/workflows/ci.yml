name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decides which jobs run. A job runs only when files it checks change; actionlint covers edits to this file.
  changes:
    runs-on: ubuntu-latest
    outputs:
      config: ${{ steps.f.outputs.config }}
      prose: ${{ steps.f.outputs.prose }}
      rust: ${{ steps.f.outputs.rust }}
      deny: ${{ steps.f.outputs.deny }}
      sql: ${{ steps.f.outputs.sql }}
      lean: ${{ steps.f.outputs.lean }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: f
        with:
          filters: |
            config:
              - '**/*.{md,yaml,yml,toml,sh}'
              - '.github/**'
            prose:
              - 'docs/tech-design/**'
              - 'docs/adr/**'
              - '.agents/skills/asd-ste100/scripts/**'
              - '.github/workflows/ci.yml'
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - 'rust-toolchain*'
            deny:
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - 'deny.toml'
            sql:
              - '**/*.sql'
            lean:
              - '**/*.lean'
              - '**/lakefile.*'
              - '**/lean-toolchain'
              - '**/lake-manifest.json'

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The cocogitto action installs cog 6.5.0, which rejects `pre` in cog.toml. Install the version used locally.
      - run: |
          curl -fsSL https://github.com/cocogitto/cocogitto/releases/download/7.0.0/cocogitto-7.0.0-x86_64-unknown-linux-musl.tar.gz | tar xz
          find . -name cog -type f -exec install -m755 {} /usr/local/bin/cog \;
      - run: cog check ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: |
          curl -fsSL https://github.com/betterleaks/betterleaks/releases/download/v1.10.1/betterleaks_1.10.1_linux_x64.tar.gz | tar xz betterleaks
          ./betterleaks git .

  config:
    needs: changes
    if: needs.changes.outputs.config == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34  # v25.0.0
      - uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c  # v3.1.1
        with:
          file_or_dir: .
          config_file: .yamllint.yaml
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7  # v2.2.0
      - run: |
          python3 -m venv "$RUNNER_TEMP/taplo"
          "$RUNNER_TEMP/taplo/bin/python" -m pip install --require-hashes --no-deps -r .github/requirements/taplo.txt
          "$RUNNER_TEMP/taplo/bin/taplo" fmt --check
      - run: git ls-files 'scripts/*.sh' | xargs -r shellcheck

  prose:
    needs: changes
    if: needs.changes.outputs.prose == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Templates (0000-*) stay out: they hold placeholder text.
      - run: git ls-files 'docs/tech-design/*.md' 'docs/adr/*.md' | grep -v '/0000-' | xargs -r python3 .agents/skills/asd-ste100/scripts/ste-lint.py

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca  # stable branch, 2026-11
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

  deny:
    needs: changes
    if: needs.changes.outputs.deny == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Skips until the first crate lands: with no Cargo.toml, cargo-deny fails.
      - if: hashFiles('Cargo.toml') != ''
        uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9  # v2.1.2

  lean:
    needs: changes
    if: needs.changes.outputs.lean == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - id: pkg
        run: echo "dir=$(git ls-files '*lakefile.toml' '*lakefile.lean' | head -1 | xargs -r dirname)" >> "$GITHUB_OUTPUT"
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee  # v1.7.1
        with:
          lake-package-directory: ${{ steps.pkg.outputs.dir }}

  sql:
    needs: changes
    if: needs.changes.outputs.sql == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Real validation: every .sql file must apply, in path order, to an empty Postgres.
      - run: |
          files=$(git ls-files '*.sql' | sort)
          pipx install sqlfluff
          echo "$files" | xargs sqlfluff lint --dialect postgres
          for f in $files; do psql -v ON_ERROR_STOP=1 -q -f "$f"; done

  # Make only this job a required check. A skipped job counts as passed.
  ci-ok:
    if: always()
    needs: [changes, commits, secrets, config, prose, rust, deny, lean, sql]
    runs-on: ubuntu-latest
    steps:
      - run: |
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = false ]
