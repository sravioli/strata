name: scorecard

on:
  # For the Branch-Protection check.
  branch_protection_rule:
  schedule:
    - cron: "37 5 * * 1"
  push:
    branches: [main]

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  analysis:
    runs-on: ubuntu-latest
    # Scorecard supports only the default branch.
    if: github.event.repository.default_branch == github.ref_name
    permissions:
      security-events: write  # Upload SARIF to code scanning.
      id-token: write  # Sign the results published to api.scorecard.dev.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5  # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          sarif_file: results.sarif
