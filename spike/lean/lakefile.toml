name = "strata_spike"
defaultTargets = ["StrataSpike"]

# Aeneas Lean library, pinned to the same commit as the Aeneas binary that
# generated StrataSpike/Generated/*.lean. Lake clones it into .lake/packages.
[[require]]
name = "aeneas"
git = "https://github.com/AeneasVerif/aeneas"
rev = "0d21a9ec7bbbb110110cacc14464a47fd71c8705"
subDir = "backends/lean"

[[lean_lib]]
name = "StrataSpike"
