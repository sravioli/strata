name = "strata"
defaultTargets = ["Strata"]

# Aeneas Lean library, pinned to the Aeneas commit of toolchain.env. The generated code in
# Strata/Generated/ needs the library of the same commit.
[[require]]
name = "aeneas"
git = "https://github.com/AeneasVerif/aeneas"
rev = "0d21a9ec7bbbb110110cacc14464a47fd71c8705"
subDir = "backends/lean"

[[lean_lib]]
name = "Strata"
