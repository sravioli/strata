# cargo-deny policy. The `deny` job in .github/workflows/ci.yml runs it.
# Docs: https://embarkstudios.github.io/cargo-deny/checks/cfg.html

[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
  # Accepted by the owner: Garage (AGPLv3, ADR 0005) and Poppler (GPL, tech design 0007).
  "AGPL-3.0-only",
  "GPL-2.0-only",
  "GPL-3.0-only",
]
# The list is policy, so a licence that no crate uses yet is not an error.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates depend on each other by path.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
