[package]
name = "strata-tests"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# L1 tests of the crate `strata` (docs/agents/testing.md). They need the services of compose.yaml.
# A separate crate, so that `strata` does not depend on `strata-dev` (TC-21-17).
[features]
l1 = []

[dependencies]
# The test program hostile-extract (src/bin) makes raw system calls.
libc = "=0.2.191"

[dev-dependencies]
strata = { path = "../strata", features = ["testing"] }
strata-core = { path = "../core" }
strata-dev = { path = "../strata-dev" }
clap = { version = "=4.6.9", features = ["derive"] }
base64 = "=0.23.1"
axum = { version = "=0.8.9", default-features = false, features = [
  "http1",
  "json",
  "tokio",
] }
getrandom = "=0.4.3"
jsonwebtoken = { version = "=12.0.0", default-features = false, features = [
  "rust_crypto",
] }
p256 = { version = "=0.14.0", features = ["pkcs8"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = [
  "macros",
  "rt-multi-thread",
  "time",
  "net",
  "io-util",
] }
tokio-postgres = { version = "=0.7.18", features = ["with-uuid-1"] }
tower = { version = "=0.5.3", features = ["util"] }
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
uuid = "=1.29.3"
url = "=2.5.9"

[[test]]
name = "dependency_graph"

[[test]]
name = "schema"
required-features = ["l1"]

[[test]]
name = "transactions"
required-features = ["l1"]

[[test]]
name = "admin"
required-features = ["l1"]

[[test]]
name = "auth"
required-features = ["l1"]

[[test]]
name = "storage"
required-features = ["l1"]

[[test]]
name = "upload"
required-features = ["l1"]

[[test]]
name = "status"
required-features = ["l1"]

[[test]]
name = "cleanup"
required-features = ["l1"]

[[test]]
name = "sandbox"
required-features = ["l1"]

[[test]]
name = "worker"
required-features = ["l1"]

[[test]]
name = "routes"
