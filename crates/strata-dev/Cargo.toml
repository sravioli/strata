[package]
name = "strata-dev"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = [
  "http1",
  "json",
  "tokio",
] }
clap = { version = "=4.6.9", features = ["derive"] }
getrandom = "=0.3.4"
jsonwebtoken = { version = "=12.0.0", default-features = false, features = [
  "rust_crypto",
] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "net"] }
