type: http_request
model: http_request
id: rq_batch_status
workspaceId: wk_strata
folderId: fl_read
name: Batch status
description: 200 with the status of each revision, 1 to 100 entries. A revision of a different tenant is not in the list. 429 with Retry-After when a bucket is empty.
sortPriority: 0
method: QUERY
url: ${[ base_url ]}/v1/revisions
headers:
- enabled: true
  name: Content-Type
  value: application/json
bodyType: application/json
body:
  text: |-
    {
      "revisions": [
        {
          "document_id": "${[ response.body.path(request='rq_start_document', path='$.document_id') ]}",
          "revision": ${[ response.body.path(request='rq_start_document', path='$.revision') ]}
        },
        {
          "document_id": "${[ response.body.path(request='rq_start_revision', path='$.document_id') ]}",
          "revision": ${[ response.body.path(request='rq_start_revision', path='$.revision') ]}
        }
      ]
    }
