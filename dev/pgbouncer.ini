; PgBouncer of compose.yaml (tech design 0049, "Local services"). Development only.
[databases]
strata = host=postgres port=5432 dbname=strata
; One server connection, for the pooler test TC-3-05.
strata_one = host=postgres port=5432 dbname=strata pool_size=1

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
; dev/pgbouncer-userlist.txt: each runtime role with its name as the secret.
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
; Protocol-level named statements through transaction mode (PgBouncer 1.21+), as in #100.
max_prepared_statements = 200
default_pool_size = 20
max_client_conn = 500
ignore_startup_parameters = extra_float_digits
